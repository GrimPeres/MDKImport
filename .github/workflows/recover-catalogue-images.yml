name: Recover missing catalogue images
on:
  push:
    paths:
      - 'nouveau-site/recover-missing-photos.py'
      - '.github/workflows/recover-catalogue-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pymupdf pillow
      - run: python nouveau-site/recover-missing-photos.py
      - name: Commit recovered catalogue images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nouveau-site/catalogue-data.js nouveau-site/fotos/
          if ! git diff --cached --quiet; then
            git commit -m "fix: recover original PDF product imagery for five pages"
            git push
          fi
